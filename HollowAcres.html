  <div id="boot"><h1>Hollow Acres</h1><p id="boot-msg">Loading…</p></div>

  <noscript><div style="color:#fff;padding:20px">Hollow Acres needs JavaScript and WebGL 2.</div></noscript>
  <script>
    // Plain (non-module) script: always runs, even when the module below can't load.
    (function () {
      // Opened from disk? This development page can't load its scripts there,
      // so jump to the self-contained game file next to it. (In the built
      // single-file game the module is inline, so this never triggers.)
      // This is the unbuilt development page. Outside the Vite dev server
      // (opened from disk, or served as-is by GitHub Pages / any static host)
      // its scripts can't load, so go to the self-contained built game.
      // The built game inlines its script, so this never fires there.
      document.addEventListener('DOMContentLoaded', function () {
        var unbuilt = document.querySelector('script[type="module"][src*="src/main.js"]');
        var devServer = document.querySelector('script[src*="@vite/client"]');
        if (unbuilt && !devServer) location.replace('HollowAcres.html' + location.search);
      });
      var msg = function (html) { var el = document.getElementById('boot-msg'); if (el) el.innerHTML = html; };
      window.addEventListener('error', function (e) {
        if (window.__HA_STARTED) return;
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          msg('The game files could not be loaded. Open <b>HollowAcres.html</b> (in the main project folder) instead.');
        } else {
          msg('Something went wrong while starting: ' + String(e.message || e.error) + '<br>Please try a current Chrome, Edge or Firefox with hardware acceleration enabled.');
        }
      }, true);
      setTimeout(function () {
        if (!window.__HA_STARTED) msg('The game didn\'t start. Open <b>HollowAcres.html</b> (in the main project folder) in Chrome, Edge or Firefox on a computer. If that also shows this message, your browser may be too old or have hardware acceleration turned off.');
      }, 6000);
    })();
  </script>
